[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddl2poco"
version = "0.1.0"
description = "Convert SQL Server CREATE TABLE DDL into C# POCO / EF Core entity classes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["sql-server", "csharp", "poco", "ef-core", "codegen", "dotnet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
ddl2poco = "ddl2poco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ddl2poco"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
